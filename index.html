062F\u0631\u064A \u0628\u064A\u0633\u0628\u0642 \u0646\u0635 \u0627\u0644\u0639\u0627\u0644\u0645.","\u0623\u0648\u0644 \u062F\u0631\u0633 \u0627\u0644\u064A\u0648\u0645 \u0623\u0635\u0639\u0628 \u062E\u0637\u0648\u0629 \u2014 \u0648\u0627\u0644\u0628\u0627\u0642\u064A \u0628\u064A\u0646\u0632\u0644 \u0644\u062D\u0627\u0644 \u0633\u0628\u064A\u0644\u0647.","\u0642\u0648\u0645\u060C \u0627\u0644\u062C\u062F\u0648\u0644 \u0645\u0633\u062A\u0646\u064A\u0643. \u0645\u0627 \u0628\u062F\u0647\u0627 \u0628\u0637\u0648\u0644\u0629\u060C \u0628\u062F\u0647\u0627 \u0628\u062F\u0627\u064A\u0629.","\u0627\u0644\u064A\u0648\u0645 \u0635\u0641\u062D\u0629 \u0628\u064A\u0636\u0627. \u0627\u0643\u062A\u0628 \u0641\u064A\u0647\u0627 \u0625\u0634\u064A \u064A\u0641\u0631\u0651\u062D\u0643 \u0622\u062E\u0631 \u0627\u0644\u0633\u0646\u0629.","\u0627\u0644\u0641\u062C\u0631 \u0648\u0642\u062A \u0645\u0627 \u0641\u064A\u0647 \u0623\u062D\u062F \u0628\u064A\u0646\u0627\u0641\u0633\u0643. \u0627\u0633\u062A\u063A\u0644\u0651\u0647.","\u062E\u0645\u0633 \u062F\u0642\u0627\u064A\u0642 \u0628\u0633\u060C \u0627\u0641\u062A\u062D \u0627\u0644\u0643\u062A\u0627\u0628 \u2014 \u0648\u0628\u0639\u062F\u064A\u0646 \u0642\u0631\u0631.","\u0645\u064A\u0646 \u0628\u062F\u0631\u0633 \u0627\u0644\u0635\u0628\u062D \u0628\u064A\u0646\u0627\u0645 \u0627\u0644\u0644\u064A\u0644 \u0645\u0631\u062A\u0627\u062D."],during:["\u0645\u0645\u062A\u0627\u0632. \u0643\u0645\u0651\u0644\u060C \u0625\u0646\u062A \u0628\u0645\u0632\u0627\u062C\u0643 \u0627\u0644\u0622\u0646.","\u0647\u0627\u064A \u0627\u0644\u0645\u0647\u0645\u0629 \u0631\u0627\u062D\u062A. \u0627\u0644\u0644\u064A \u0628\u0639\u062F\u0647\u0627 \u0623\u0633\u0647\u0644.","\u0643\u0644 \u062F\u0631\u0633 \u0628\u062A\u062E\u062A\u0645\u0647 \u0628\u064A\u0642\u0644\u0651 \u0627\u0644\u062D\u0645\u0644 \u0639\u0646 \u0622\u062E\u0631 \u0627\u0644\u0633\u0646\u0629.","\u0627\u0644\u062A\u0631\u0643\u064A\u0632 \u0639\u0636\u0644\u0629 \u2014 \u0648\u0625 self.addEventListener("fetch",e=>{ if(e.request.method!=="GET")return;
 e.respondWith(caches.open("tawjihi-v1").then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(n=>{try{c.put(e.request,n.clone())}catch(_){};return n}).catch(()=>r))));});`;

}
